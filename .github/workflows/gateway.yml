name: gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore gateway/Gateway.Host/Gateway.Host.csproj gateway/tests/Gateway.Host.Tests/Gateway.Host.Tests.csproj

      - name: Format check
        run: dotnet format gateway/Gateway.Host/Gateway.Host.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build gateway/Gateway.Host/Gateway.Host.csproj gateway/tests/Gateway.Host.Tests/Gateway.Host.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test gateway/tests/Gateway.Host.Tests/Gateway.Host.Tests.csproj --no-build --configuration Release
