name: snow-app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snow-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `now-sdk build` was confirmed (Phase 0) to require an authenticated
      # ServiceNow instance — it hangs waiting on that rather than failing
      # cleanly offline. Until Phase 1 scaffolds a real project and this is
      # resolved (e.g. build against a recorded fixture, or a dedicated CI
      # PDI), this lane stays lint-only. See docs/servicenow-compatibility.md.
