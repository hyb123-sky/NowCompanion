name: snow-app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  snow-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snow-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `now-sdk build` needs a real scopeId in now.config.json (obtained via
      # an authenticated call, Phase 1) but does NOT need auth itself once
      # that's committed - confirmed by running it locally with no
      # credential in scope. `now-sdk install` (deploy) still needs the PDI
      # credential and stays a manual, human-run step - see
      # docs/servicenow-compatibility.md.
      - name: Build
        run: npm run build

      # Blocking: production dependencies must have zero known high/critical
      # vulnerabilities. This package currently ships no runtime dependencies
      # (@servicenow/sdk is dev/build tooling), so this passes trivially.
      # Dev-toolchain vulnerabilities (the SDK itself has several, tracked
      # separately) don't block here — see
      # .github/workflows/dependency-audit.yml and docs/dependency-audit.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
