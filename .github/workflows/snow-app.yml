name: snow-app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  snow-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snow-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `now-sdk build` was confirmed (Phase 0) to require an authenticated
      # ServiceNow instance — it hangs waiting on that rather than failing
      # cleanly offline. Until Phase 1 scaffolds a real project and this is
      # resolved (e.g. build against a recorded fixture, or a dedicated CI
      # PDI), this lane stays lint-only. See docs/servicenow-compatibility.md.

      # Blocking: production dependencies must have zero known high/critical
      # vulnerabilities. This package currently ships no runtime dependencies
      # (@servicenow/sdk is dev/build tooling), so this passes trivially.
      # Dev-toolchain vulnerabilities (the SDK itself has several, tracked
      # separately) don't block here — see
      # .github/workflows/dependency-audit.yml and docs/dependency-audit.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
