name: live2d-web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  live2d-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/live2d-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Blocking: production dependencies must have zero known high/critical
      # vulnerabilities (security-questionnaire requirement). This package
      # currently ships no runtime dependencies, so the check passes
      # trivially — it starts doing real work once Phase 3 adds any.
      # Dev-toolchain vulnerabilities are tracked separately and don't block
      # here — see .github/workflows/dependency-audit.yml and
      # docs/dependency-audit.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
